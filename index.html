<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRISHTI - Diabetic Retinopathy Companion</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="page">

        <header class="header">
            <div class="logo">
                <img src="logo.png" alt="DRISHTI Logo" class="logo-image">

                <div class="logo-text">
                    <h1>DRISHTI</h1>
                    <p>YOUR DIABETIC RETINOPATHY COMPANION</p>
                </div>
            </div>
        </header>

        <section class="login-card">

            <div class="profile-section">
                <div class="profile-picture">
                    <div class="profile-head"></div>
                    <div class="profile-body"></div>
                </div>
            </div>

            <div class="login-section">
                <form id="loginForm">
                    <div class="input-group">
                        <input
                            type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div class="forgot-password">
                        <a href="#">Forget password</a>
                    </div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                    <div class="create-account">
                        <a href="create-account.html">Create new account</a>
                    </div>

                    <div id="demoLoginBtn" style="margin-top: 16px; font-size: 12px; color: #363775; background: #e0e2f5; padding: 8px 12px; border-radius: 6px; text-align: center; cursor: pointer; border: 1px dashed #aaa8d0;">
                        <span>Click for Demo Login: <strong>dr.ananya@dire.com</strong></span>
                    </div>
                </form>
            </div>

        </section>

    </main>
    <script src="login.js"></script>

</body>
</html>
